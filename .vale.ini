StylesPath = styles
MinAlertLevel = warning

Packages = Google

[*.md]
BasedOnStyles = Vale, Google

# Disable rules that produce false positives in technical documentation
Google.We = NO
Google.FirstPerson = NO
Google.WordList = NO
Google.Headings = NO
Google.EmDash = NO
Google.Acronyms = NO
Google.Parens = NO
Google.Colons = NO
Google.Units = NO
Google.Latin = NO
Google.Quotes = NO
Google.Ordinal = NO
Google.Exclamation = NO
Google.Ellipses = NO
Vale.Spelling = NO

# Keep actionable rules — these catch real readability issues
# Google.Passive — passive voice ("is handled by" → "X handles")
# Google.Will — future tense ("will run" → "runs")
# Google.Semicolons — overuse of semicolons
# Google.OxfordComma — missing Oxford comma
